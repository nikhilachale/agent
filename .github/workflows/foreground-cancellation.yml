name: Foreground cancellation qualification
on:
  push:
    branches: [fix/foreground-command-cancellation]
  pull_request:
    paths:
      - 'libs/mcp/server/**'
      - '.github/workflows/foreground-cancellation.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Generate formatting receipt
        run: |
          cargo fmt --all
          git diff > formatting.patch
      - uses: actions/upload-artifact@v4
        with:
          name: formatting-${{ github.sha }}
          path: formatting.patch
      - run: cargo test --locked -p stakpak-mcp-server foreground_ -- --nocapture
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: |
          cargo test --locked -p stakpak-shared --features sqlite
          cargo test --locked -p stakpak --features libsql-test
          cargo test --locked -p stakpak-gateway --features libsql-test
          cargo test --locked -p stakai --features network-tests
      - run: cargo build --locked --release -p stakpak
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: stakpak-linux-prerelease-${{ github.sha }}
          path: target/release/stakpak
