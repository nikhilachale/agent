name: Foreground cancellation qualification
on:
  push:
    branches: [fix/foreground-command-cancellation]
  pull_request:
    paths:
      - 'libs/mcp/server/**'
      - '.github/workflows/foreground-cancellation.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p stakpak-mcp-server foreground_ -- --nocapture
      - run: cargo build --locked --release -p stakpak
      - uses: actions/upload-artifact@v4
        with:
          name: stakpak-linux-prerelease-${{ github.sha }}
          path: target/release/stakpak
